apiVersion: v1
kind: ServiceAccount
metadata:
  name: topology-scheduler
  namespace: research
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: topology-scheduler-workloads
  namespace: research
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["scheduling.run.ai"]
    resources: ["podgroups"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: topology-scheduler-workloads
  namespace: research
subjects:
  - kind: ServiceAccount
    name: topology-scheduler
    namespace: research
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: topology-scheduler-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: topology-scheduler-discovery
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["scheduling.run.ai"]
    resources: ["queues"]
    verbs: ["get", "list"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: topology-scheduler-discovery
subjects:
  - kind: ServiceAccount
    name: topology-scheduler
    namespace: research
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: topology-scheduler-discovery

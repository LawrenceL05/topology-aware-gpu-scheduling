[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-aware-gpu-scheduling"
version = "0.1.1"
description = "Experimental workload-aware node placement with Ray"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ray = ["ray==2.49.0"]

[tool.setuptools.packages.find]
include = ["topology_scheduler*"]

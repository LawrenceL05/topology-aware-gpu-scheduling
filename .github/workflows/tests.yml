name: Tests
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_docs.py' -v
      - run: python scripts/check_docs.py --run-examples
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[ray]'
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.plan
      - run: python -m examples.compare_policies
      - run: python -m examples.kai_manifest
      - run: python -m examples.kai_submit --help
      - run: python -m examples.ray_smoke
      - run: python -m examples.ray_multinode_smoke
      - run: python -m examples.dynamo_smoke
